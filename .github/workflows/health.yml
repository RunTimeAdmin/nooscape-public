# A read-only check of the live site, every six hours (it was every three until
# 2026-10-20, to save Actions minutes). It fails when a scheduled source has
# stopped running, the reviewed census or directory stops being served, the dev
# runtime reappears, the operator surface stops refusing unauthenticated calls,
# or a pay-per-call payment has been unresolved for over an hour. Public
# endpoints only; no secret is used.
#
# A failure opens (or comments on) one issue, so an outage is noticed without
# anyone having to look. Deploys serve transient 404s for 15-20 minutes
# (see the handoff's deploy-window note), so this does not run on every push;
# the next scheduled run verifies a deploy.
name: Live health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the live site
        run: node apps/nooscape-relay/scripts/verify-live.mjs

      - name: Report a failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live health check is failing"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="The scheduled live check failed. Details are in the run summary: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing. $body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
